<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger House - Cadastro de Produto</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/site.webmanifest" />
</head>
<body>

    <h1>Cadastre um Novo Produto</h1>

    <img src="logo.png" class="logo">

    <h3>Insira as informações do produto</h3>

    <div class="container">

        <form>

            <label>Nome do Produto</label>
            <input>

            <br><br>

            <label>Categoria</label>

            <select>
                <option>Molhos</option>
                <option>Ingredientes</option>
                <option>Preparados</option>
            </select>

            <br><br>

            <label>Marca</label>
            <input>

            <br><br>

            <label>Unidade de Medida</label>

            <select>
                <option>Grama (g)</option>
                <option>Quilograma (kg)</option>
                <option>Mililitros (ml)</option>
                <option>Litros (L)</option>
                <option>Unidade</option>
            </select>

            <br><br>

            <label>Quantidade em Estoque</label>
            <input type="number">

            <br><br>

            <label>Data de Validade</label>
            <input type="date">

            <br><br>

            <label>Lote</label>
            <input>

            <br><br>

            <label>Preço de Compra</label>
            <input type="number">

            <br><br>

            <label>Fornecedor</label>
            <input>

            <br><br>

            <label>Código de Barras</label>
            <input type="number">

            <br><br>

            <label>Localização no Estoque</label>
            <input>

            <br><br>

            <label>Observações</label>

            <textarea rows="4"></textarea>

            <br><br>

            <div class="center">

                <a href="principal.html">
                    <button type="button">Finalizar Cadastro</button>
                </a>

                <br><br>

                <a href="cadastro_produto.html">
                    <button type="button">Limpar Formulário</button>
                </a>

            </div>

        </form>

    </div>

    <div class="footer">
        © 2026 Burger House — Todos os direitos reservados.
    </div>

</body>
</html>
