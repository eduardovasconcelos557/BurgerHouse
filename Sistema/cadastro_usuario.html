<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger House - Cadastro de Usuário</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="site.webmanifest" />
</head>
<body>

    <h1>Faça seu cadastro na Burger House!</h1>

    <img src="logo.png" class="logo">

    <h3>Insira suas informações</h3>

    <div class="container">

        <form>

            <label>Nome Completo</label>
            <input>

            <br><br>

            <label>E-mail</label>
            <input type="email">

            <br><br>

            <label>Login (nome de usuário)</label>
            <input>

            <br><br>

            <label>Senha de Acesso</label>
            <input type="password">

            <br><br>

            <label>Confirmação da Senha</label>
            <input type="password">

            <br><br>

            <h3>Informe seu endereço</h3>

            <label>Logradouro</label>
            <select>
                <option>Rua</option>
                <option>Avenida</option>
                <option>Rodovia</option>
                <option>Alameda</option>
            </select>

            <br><br>

            <label>Nome do Logradouro</label>
            <input>

            <br><br>

            <label>Nº da Residência</label>
            <input type="number">

            <br><br>

            <label>Bairro</label>
            <input>

            <br><br>

            <label>Cidade</label>
            <input>

            <br><br>

            <label>Unidade Federativa</label>

            <select>
                <option>Selecione um estado</option>
                <option>Acre</option>
                <option>Alagoas</option>
                <option>Amapá</option>
                <option>Amazonas</option>
                <option>Bahia</option>
                <option>Ceará</option>
                <option>Distrito Federal</option>
                <option>Espírito Santo</option>
                <option>Goiás</option>
                <option>Maranhão</option>
                <option>Mato Grosso</option>
                <option>Mato Grosso do Sul</option>
                <option>Minas Gerais</option>
                <option>Pará</option>
                <option>Paraíba</option>
                <option>Paraná</option>
                <option>Pernambuco</option>
                <option>Piauí</option>
                <option>Rio de Janeiro</option>
                <option>Rio Grande do Norte</option>
                <option>Rio Grande do Sul</option>
                <option>Rondônia</option>
                <option>Roraima</option>
                <option>Santa Catarina</option>
                <option>São Paulo</option>
                <option>Sergipe</option>
                <option>Tocantins</option>
            </select>

            <br><br>

            <label>CEP</label>
            <input type="number">

            <br><br>

            <div class="center">

                <a href="index.html">
                    <button type="button">Finalizar Cadastro</button>
                </a>

                <br><br>

                <a href="cadastro_usuario.html">
                    <button type="button">Limpar Formulário</button>
                </a>

            </div>

        </form>

    </div>

    <div class="footer">
        © 2026 Burger House — Todos os direitos reservados.
    </div>

</body>
</html>
